<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, sans-serif" role="img" aria-label="Ilustrasi gedung layanan kampus dan antrean tiket digital">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="0.65" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="hall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f3563"/>
      <stop offset="1" stop-color="#0f1f3d"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="0.55" stop-color="#fde68a" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- langit -->
  <rect width="640" height="480" rx="24" fill="url(#sky)"/>
  <circle cx="516" cy="92" r="72" fill="url(#sun)"/>
  <circle cx="516" cy="92" r="30" fill="#fbbf24"/>
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="140" cy="86" rx="46" ry="16"/>
    <ellipse cx="176" cy="76" rx="34" ry="14"/>
    <ellipse cx="420" cy="150" rx="38" ry="13" opacity="0.7"/>
  </g>

  <!-- tanah -->
  <rect y="356" width="640" height="124" fill="#e2e8f0"/>
  <rect y="356" width="640" height="10" fill="#cbd5e1"/>
  <path d="M0 420 Q 320 396 640 420 L640 480 L0 480 Z" fill="#dbe3ee"/>

  <!-- pepohonan -->
  <g>
    <rect x="66" y="300" width="12" height="62" rx="6" fill="#92400e" opacity="0.75"/>
    <circle cx="72" cy="282" r="34" fill="#34d399"/>
    <circle cx="52" cy="296" r="20" fill="#6ee7b7"/>
    <rect x="560" y="306" width="12" height="56" rx="6" fill="#92400e" opacity="0.75"/>
    <circle cx="566" cy="288" r="30" fill="#34d399"/>
    <circle cx="584" cy="300" r="17" fill="#6ee7b7"/>
  </g>

  <!-- gedung utama -->
  <g>
    <rect x="208" y="196" width="224" height="130" rx="8" fill="url(#hall)"/>
    <rect x="208" y="196" width="224" height="130" rx="8" fill="none" stroke="#0a1630" stroke-width="3"/>
    <polygon points="196,198 320,138 444,198" fill="url(#roof)"/>
    <rect x="312" y="112" width="8" height="44" fill="#0f1f3d"/>
    <polygon points="320,108 356,120 320,132" fill="#4f46e5"/>
    <g fill="#e0e7ff">
      <rect x="226" y="222" width="26" height="84" rx="4"/>
      <rect x="266" y="222" width="26" height="84" rx="4"/>
      <rect x="348" y="222" width="26" height="84" rx="4"/>
      <rect x="388" y="222" width="26" height="84" rx="4"/>
    </g>
    <rect x="300" y="238" width="40" height="68" rx="6" fill="#22d3ee"/>
    <rect x="300" y="238" width="40" height="68" rx="6" fill="none" stroke="#0a1630" stroke-width="3"/>
    <rect x="316" y="266" width="8" height="8" rx="4" fill="#0f1f3d"/>
    <rect x="196" y="306" width="248" height="12" rx="4" fill="#c7d2fe"/>
    <rect x="188" y="318" width="264" height="12" rx="4" fill="#a5b4fc"/>
    <rect x="180" y="330" width="280" height="12" rx="4" fill="#c7d2fe"/>
    <rect x="232" y="170" width="176" height="22" rx="11" fill="#0f1f3d"/>
    <text x="320" y="186" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="3" fill="#67e8f9">LAYANAN KAMPUS</text>
  </g>

  <!-- sayap kiri & kanan -->
  <g fill="#16294f" stroke="#0a1630" stroke-width="3">
    <rect x="120" y="252" width="72" height="76" rx="6"/>
    <rect x="448" y="252" width="72" height="76" rx="6"/>
  </g>
  <g fill="#a5b4fc">
    <rect x="130" y="264" width="18" height="24" rx="3"/>
    <rect x="154" y="264" width="18" height="24" rx="3"/>
    <rect x="458" y="264" width="18" height="24" rx="3"/>
    <rect x="482" y="264" width="18" height="24" rx="3"/>
  </g>

  <!-- jalur antrean -->
  <path d="M60 448 Q 200 428 330 440 T 560 436" fill="none" stroke="#4f46e5" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round" opacity="0.6"/>

  <!-- orang antre -->
  <g>
    <circle cx="120" cy="404" r="12" fill="#fbbf24"/><rect x="106" y="418" width="28" height="30" rx="10" fill="#4f46e5"/>
    <circle cx="180" cy="408" r="12" fill="#fca5a5"/><rect x="166" y="422" width="28" height="26" rx="10" fill="#0f1f3d"/>
    <circle cx="238" cy="410" r="12" fill="#93c5fd"/><rect x="224" y="424" width="28" height="24" rx="10" fill="#22d3ee"/>
    <circle cx="296" cy="412" r="12" fill="#6ee7b7"/><rect x="282" y="426" width="28" height="22" rx="10" fill="#1f3563"/>
  </g>

  <!-- kartu tiket -->
  <g>
    <rect x="428" y="356" width="168" height="96" rx="14" fill="#ffffff" stroke="#0f1f3d" stroke-width="3"/>
    <text x="444" y="384" font-size="12" font-weight="800" letter-spacing="2" fill="#64748b">NOMOR ANDA</text>
    <text x="444" y="422" font-size="40" font-weight="900" font-family="ui-monospace, Menlo, monospace" fill="#0f1f3d">A-004</text>
    <rect x="540" y="392" width="40" height="24" rx="12" fill="#dcfce7"/>
    <text x="560" y="409" text-anchor="middle" font-size="11" font-weight="800" fill="#15803d">AKTIF</text>
    <line x1="428" y1="436" x2="596" y2="436" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 5"/>
  </g>
</svg>
